    <script>
      // Suprime avisos inofensivos de WebSocket do servidor de desenvolvimento
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message?.includes('WebSocket') || e.reason.toString?.().includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>

    <script>
      // Suprime avisos inofensivos de WebSocket do servidor Vite em ambiente de container
      (function() {
        var origError = console.error;
        console.error = function() {
          var arg0 = arguments[0];
          if (
            typeof arg0 === 'string' &&
            (arg0.includes('failed to connect to websocket') || arg0.includes('WebSocket closed without opened'))
          ) {
            return;
          }
          origError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e.reason && (e.reason.message || (typeof e.reason === 'string' ? e.reason : ''))) || '';
          if (msg.includes('WebSocket') || msg.includes('websocket')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
